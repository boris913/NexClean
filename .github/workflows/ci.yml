# Intégration continue NEXCLEAN.
# - verifications : types, tests unitaires + intégration sur un vrai PostgreSQL 16, build Next.js
# - docker        : image de production + PostgreSQL (composition du VPS), migrations au démarrage,
#                   pages publiques et Back-Office, script d'initialisation, tâche planifiée
# - audit         : aucune vulnérabilité critique dans les dépendances de production
# - deploiement   : sur main uniquement, si tout est vert, déploiement en production via Coolify
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifications:
    name: Types, tests (PostgreSQL 16), build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Le garde-fou des tests exige un nom de base en « _test ».
          POSTGRES_DB: nexclean_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d nexclean_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/nexclean_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests unitaires et d'intégration
        run: npm test
      - name: Build Next.js
        run: npm run build
      - name: Build des scripts d'exploitation
        run: npm run build:scripts

  docker:
    name: Image Docker + PostgreSQL (essai de démarrage)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-mot-de-passe-postgres
      BETTER_AUTH_SECRET: ci-secret-uniquement-pour-les-tests-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      COMPOSE: docker compose -f docker-compose.yml -f .github/ci/compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - name: Construction et démarrage (migrations appliquées par l'entrypoint)
        run: $COMPOSE up -d --build --wait --wait-timeout 180
      - name: Pages publiques et Back-Office
        run: |
          set -e
          verifier() {
            code=$(curl -s -o /tmp/page -w '%{http_code}' "http://localhost:3000$1")
            echo "$1 → HTTP $code"
            [ "$code" = "$2" ] || { head -c 2000 /tmp/page; exit 1; }
          }
          verifier / 200
          verifier /robots.txt 200
          verifier /api/version 200
          grep -q '"commit"' /tmp/page
          verifier /contact 200
          verifier /recrutement 200
          verifier /recrutement/demander-du-personnel 200
          verifier /admin/connexion 200
          verifier /suivi/jeton-inexistant 200
          grep -q 'Lien invalide ou expiré' /tmp/page
          # Sans session, le Back-Office renvoie vers la connexion.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin/dossiers)
          echo "/admin/dossiers (sans session) → HTTP $code"
          [ "$code" = "307" ]
      - name: Initialisation (référentiel + premier administrateur)
        run: |
          set -e
          $COMPOSE exec -T app node dist-scripts/initialiser.cjs --nom "CI Admin" --email ci@nexclean.test | tee /tmp/init
          grep -q "Lien d'activation" /tmp/init
          lien=$(grep -o 'http://localhost:3000/admin/activation/[A-Za-z0-9_-]*' /tmp/init | head -1)
          code=$(curl -s -o /tmp/page -w '%{http_code}' "$lien")
          echo "page d'activation → HTTP $code"
          [ "$code" = "200" ]
          grep -q 'Activer mon compte' /tmp/page
      - name: Tâche planifiée et purge
        run: |
          set -e
          $COMPOSE exec -T app node dist-scripts/taches.cjs
          $COMPOSE exec -T app node dist-scripts/purger-documents.cjs
      - name: Redémarrage (migrations déjà appliquées, données conservées)
        run: |
          set -e
          $COMPOSE restart app
          $COMPOSE up -d --wait --wait-timeout 120
          $COMPOSE exec -T app node dist-scripts/initialiser.cjs --nom "CI Admin" --email ci@nexclean.test | tee /tmp/init2
          grep -q 'Un administrateur actif existe déjà' /tmp/init2
      - name: Journaux en cas d'échec
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Arrêt
        if: always()
        run: $COMPOSE down -v

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bloquant pour les vulnérabilités critiques. Restent connues et acceptées (niveau inférieur) :
    # postcss embarqué par Next.js (compilation de nos propres CSS au build) et esbuild de drizzle-kit
    # (outil de développement, absent de l'image de production).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=critical

  deploiement:
    name: Déploiement en production (Coolify)
    # Uniquement après un push sur main (fusion d'une PR), et seulement si toutes les vérifications sont vertes.
    needs: [verifications, docker, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Un déploiement en cours n'est jamais interrompu par le suivant : ils s'enchaînent.
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    steps:
      # Seul point d'entrée public de Coolify : POST https://deploy.nexclean.xyz/api/v1/deploy (route Traefik dédiée),
      # avec un jeton limité au droit « deploy » (ne peut ni lire ni modifier la configuration).
      - name: Lancement du déploiement
        env:
          JETON: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          APPLICATION: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          set -e
          reponse=$(curl -sS --fail-with-body -X POST "https://deploy.nexclean.xyz/api/v1/deploy?uuid=$APPLICATION"             -H "Authorization: Bearer $JETON")
          echo "$reponse"
          echo "$reponse" | grep -q 'deployment_uuid'
      - name: Nouvelle version en ligne
        env:
          ATTENDU: ${{ github.sha }}
        run: |
          # Le build sur le VPS prend plusieurs minutes ; l'ancienne version reste servie pendant ce temps.
          # On attend que le site serve exactement le commit fusionné (SOURCE_COMMIT exposé par /api/version).
          for i in $(seq 1 45); do
            commit=$(curl -s https://nexclean.xyz/api/version | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            echo "tentative $i : en ligne ${commit:-?} (attendu $ATTENDU)"
            if [ "$commit" = "$ATTENDU" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' https://nexclean.xyz/)
              echo "page d'accueil → HTTP $code"
              [ "$code" = "200" ] && exit 0
            fi
            sleep 20
          done
          echo "::error::La nouvelle version n'est pas en ligne après 15 minutes. Voir les journaux de déploiement dans Coolify."
          exit 1
