# Messagerie NEXCLEAN (Stalwart). Hors Coolify : un déploiement du site ne touche pas au courrier.
# Installé dans /opt/nexclean-mail/ ; voir docs/exploitation.md, section Messagerie.
#
# Publication volontairement restreinte : SMTP entrant (25), envoi (587), IMAP (993).
# Le 443 reste à Traefik, qui transmet mail.nexclean.xyz en TCP (nexclean-mail.yaml).
# 8080 (administration en clair) n'est joignable que depuis le serveur, par tunnel SSH :
#   ssh -N -L 18080:127.0.0.1:18080 nexclean-vps
# Le réseau coolify gère l'IPv6 : Stalwart voit ainsi la vraie adresse des expéditeurs,
# en IPv4 comme en IPv6, indispensable à l'antispam et au bannissement automatique.
services:
  stalwart:
    image: stalwartlabs/stalwart:v1.0.3
    container_name: nexclean-mail
    init: true
    restart: unless-stopped
    environment:
      STALWART_PUBLIC_URL: https://mail.nexclean.xyz
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
      - "127.0.0.1:18080:8080"
    volumes:
      - /var/lib/nexclean-mail/etc:/etc/stalwart
      - /var/lib/nexclean-mail/data:/var/lib/stalwart
    networks:
      coolify:
        aliases:
          - nexclean-mail

networks:
  coolify:
    external: true
